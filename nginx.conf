server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    #redirect to backend container
    location /api/ {
        proxy_pass http://backend:3000;
    }

    # Vite produces fingerprinted assets; cache them aggressively.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The React router must receive unknown application routes.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
